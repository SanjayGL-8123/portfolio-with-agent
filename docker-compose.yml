version: '3.8'

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sanjay-portfolio-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_DEBUG=0
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-U3VwZXJTZWN1cmVGbGFza015U1FMUGFzc3dvcmRLZXk=}
      # Uncomment DATABASE_URL to connect to external MySQL / PostgreSQL
      # - DATABASE_URL=mysql+pymysql://user:password@db:3306/portfolio
    volumes:
      # Persist SQLite database and uploads across container rebuilds
      - ./database:/app/database
      - ./assets:/app/assets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:5000/health').getcode() == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
