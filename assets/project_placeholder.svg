<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#0d1829"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Glowing background elements -->
  <circle cx="400" cy="225" r="160" fill="url(#glow)" filter="blur(40px)"/>

  <!-- Code card illustration -->
  <g transform="translate(260, 105)">
    <!-- Card Base -->
    <rect width="280" height="240" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="280" height="36" rx="16" fill="rgba(255, 255, 255, 0.05)"/>
    <rect y="20" width="280" height="16" fill="rgba(255, 255, 255, 0.05)"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    
    <!-- Code / Terminal Brackets Icon -->
    <g transform="translate(90, 75)">
      <circle cx="50" cy="45" r="42" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
      <!-- < / > Symbol -->
      <path d="M 32 45 L 44 33 M 32 45 L 44 57" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 68 45 L 56 33 M 68 45 L 56 57" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 53 30 L 47 60" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Syntax mock lines -->
    <rect x="36" y="180" width="120" height="7" rx="3.5" fill="rgba(16, 185, 129, 0.5)"/>
    <rect x="164" y="180" width="80" height="7" rx="3.5" fill="rgba(56, 189, 248, 0.4)"/>
    <rect x="36" y="196" width="70" height="7" rx="3.5" fill="rgba(168, 85, 247, 0.45)"/>
    <rect x="114" y="196" width="130" height="7" rx="3.5" fill="rgba(255, 255, 255, 0.2)"/>
    <rect x="36" y="212" width="150" height="7" rx="3.5" fill="rgba(245, 158, 11, 0.4)"/>
  </g>
</svg>